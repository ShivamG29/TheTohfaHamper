{% extends 'base.html' %}
{% load static%}

{% block content %}
<style>
    .form-control
    {
    border:1px solid black;
    box-shadow:0px 2px 0px rgba(0,0,0,0.5);
    }
    .bt:hover
    {
    background:rgba(0,0,0,0.5);
    color:white;
    }
</style>


<div style="background:linear-gradient(to top left, transparent,rgba(0, 0, 0, 0.8));">


<div class="row py-3 ">
        <center><div class="h2 text-light">Sign <b class="text-warning"> up </b> <i class="fa fa-users"></i></div></center>
    <div class="col-sm-4"></div>
    <div class="col-sm-4 p-5 " style="background-image: url({% static 'images/contactbg.jpg' %}); height:575px;">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <b style="font-family:Italic;font-size:20px;">Name :-</b><input type="text" name="name" required class="form-control bt" placeholder="Enter Your Name..."/>
            <b style="font-family:Italic;font-size:20px;">Mobile :-</b><input type="number" name="mobile" required class="form-control bt"
                         placeholder="Enter Your MobileNo..."/>
            <b style="font-family:Italic;font-size:20px;">Email :-</b><input type="email" name="email" required class="form-control bt" placeholder="Enter Your email..."/>
            <b style="font-family:Italic;font-size:20px;">Password :-</b><input type="password" name="passwd" required class="form-control bt" placeholder="Enter Your password..."/>
            <b style="font-family:Italic;font-size:20px;">Profile :-</b><input type="file" name="fu" required class="form-control bt"/>
            <b style="font-family:Italic;font-size:20px;">Address :-</b>
            <textarea class="form-control txta bt" name="address" placeholder="Enter Your Massege..." required
                      style="min-height:80px; resize:none;"></textarea>
            <center><input type="submit" value="save" class="btn btn-info bt w-25 m-3"style=" border:1px solid black;box-shadow:0px 2px 0px rgba(0,0,0,0.5);font-family:Italic;/></center>

        </form>
    </div>
    <div class="col-sm-4"></div>
</div>

</div>
{% endblock %}
